<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idée Vision</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#0A0D1F;--ink2:#141838;--amber:#FFB84D;--paper:#FFF6E5;--mut:#A8A9C4;--coral:#FF6B5B;--line:rgba(255,184,77,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.beam{position:fixed;left:50%;top:-6vh;width:150vw;height:80vh;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,184,77,.30),rgba(255,184,77,0) 85%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);filter:blur(18px);z-index:0;animation:beam 6s ease-in-out infinite alternate;pointer-events:none}
@keyframes beam{from{opacity:.55}to{opacity:1}}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 22px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.screen.on{display:flex}
#home.on{animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.top{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--amber);display:grid;place-items:center;font-weight:800;letter-spacing:.5px;color:var(--amber);background:rgba(255,184,77,.08)}
.top b{display:block;font-size:17px}.top small{color:var(--mut);font-size:13px}
.top .sp{flex:1}
.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,246,229,.06);color:var(--paper);font-size:20px;display:grid;place-items:center;cursor:pointer}
.round:active{transform:scale(.92)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:31px;line-height:1.15;margin:30px 0 20px;letter-spacing:-.5px}
.gate{border:1px solid var(--line);border-radius:30px;background:rgba(10,13,31,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:18px 18px 14px;box-shadow:0 20px 60px rgba(255,184,77,.10)}
textarea{width:100%;min-height:170px;max-height:38vh;background:transparent;border:0;outline:0;resize:none;color:var(--paper);font:400 17px/1.5 system-ui,sans-serif}
textarea::placeholder{color:#7C7EA3}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.row span{color:var(--mut);font-size:13px}
.cta{border:0;border-radius:999px;background:var(--amber);color:#1B1305;font:700 16px system-ui,sans-serif;padding:15px 26px;cursor:pointer;box-shadow:0 8px 28px rgba(255,184,77,.35)}
.cta:active{transform:scale(.96)}
.ghost{border:1px solid var(--line);background:rgba(10,13,31,.6);color:var(--paper);border-radius:999px;font:600 15px system-ui,sans-serif;padding:14px 24px;cursor:pointer}
.chips{display:flex;gap:10px;overflow-x:auto;padding:18px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--paper);font:500 14px system-ui,sans-serif;padding:11px 16px;cursor:pointer;white-space:nowrap}
.msg{min-height:22px;margin:10px 4px 0;color:var(--coral);font-size:14.5px;line-height:1.45}
.center{margin:auto 0;text-align:center}
.ring{width:84px;height:84px;margin:0 auto 26px;border-radius:50%;border:3px solid rgba(255,184,77,.18);border-top-color:var(--amber);animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center h2{font-family:Georgia,serif;font-size:26px;margin:0 0 10px}
.center p{color:var(--mut);margin:0 auto 18px;max-width:34ch;line-height:1.5;font-size:15px}
.und{font-family:Georgia,serif;font-style:italic;font-size:18px;line-height:1.55;color:var(--paper);max-width:34ch;margin:0 auto 26px}
.bar{height:8px;border-radius:99px;background:rgba(255,246,229,.1);overflow:hidden;max-width:300px;margin:0 auto}
.bar b{display:block;height:100%;width:0;background:var(--amber);border-radius:99px;transition:width .6s}
#play{padding:0;background:var(--ink);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(0deg,rgba(10,13,31,.92),transparent);pointer-events:none}
.xbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:3;background:rgba(10,13,31,.6)}
.cap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);padding:0 22px;z-index:3;text-align:center}
.cap p{margin:0;font-family:Georgia,serif;font-size:20px;line-height:1.45;text-shadow:0 2px 14px rgba(0,0,0,.95)}
#pbar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:3;display:flex;justify-content:center;gap:12px}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(5,6,16,.7);align-items:flex-end}
#sheet.on{display:flex}
.panel{width:100%;max-height:92vh;overflow-y:auto;background:var(--ink2);border-radius:32px 32px 0 0;border-top:1px solid var(--line);padding:24px 22px calc(env(safe-area-inset-bottom,0px) + 22px);animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.panel h3{font-family:Georgia,serif;font-size:24px;margin:0 0 6px}
.panel p{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 14px}
.panel label{display:block;font-weight:600;font-size:14.5px;margin:16px 4px 7px}
.panel label small{display:block;font-weight:400;color:var(--mut);margin-top:2px}
.panel input{width:100%;border:1px solid var(--line);background:rgba(10,13,31,.7);color:var(--paper);border-radius:999px;padding:14px 18px;font:400 15px system-ui,sans-serif;outline:0}
.panel .cta{width:100%;margin-top:22px}
@media (prefers-reduced-motion:reduce){.beam,.ring{animation:none!important}}
</style></head>
<body>
<div class="beam"></div>

<section id="home" class="screen on">
  <header class="top"><div class="logo">BH</div><div><b>Idée Vision</b><small>Ton idée, en mouvement</small></div><div class="sp"></div><button class="round" id="gear" aria-label="Réglages">⚙</button></header>
  <h1>Décris ton idée.<br>Elle devient un film.</h1>
  <div class="gate">
    <textarea id="idea" placeholder="Dis ce que tu penses, avec les nombres et ce qui bouge : une balance, une maison, une expérience…"></textarea>
    <div class="row"><span id="cnt">0 caractère</span><button class="cta" id="go">Voir mon idée</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <p class="msg" id="msg"></p>
</section>

<section id="work" class="screen">
  <div class="center">
    <div class="ring"></div>
    <h2 id="wt">Je lis ton idée…</h2>
    <p id="ws">Un instant, je comprends ce que tu veux montrer.</p>
    <div class="und" id="und"></div>
    <div class="bar"><b id="wb"></b></div>
  </div>
</section>

<section id="play" class="screen">
  <canvas id="cv"></canvas><div class="shade"></div>
  <button class="round xbtn" id="close" aria-label="Fermer">✕</button>
  <div class="cap"><p id="cap"></p></div>
  <div id="pbar"></div>
</section>

<div id="sheet"><div class="panel">
  <h3>Clé d'accès</h3>
  <p>Elle reste seulement sur ton téléphone.</p>
  <label>Clé Groq<small>Gratuite sur console.groq.com. Elle sert à comprendre ton idée et à écrire l'animation.</small></label><input id="kq" type="password" autocomplete="off" placeholder="gsk_…">
  <button class="cta" id="save">Enregistrer</button>
</div></div>

<script>
/*ENGINE*/
function makeS(scene,dry,cam,hooks){
  const S={aborted:false,tweens:[],levels:[]};
  const mat=o=>new THREE.MeshStandardMaterial({color:new THREE.Color(o.color||'#cccccc'),roughness:o.rough!==undefined?o.rough:.55,metalness:.05,transparent:true,opacity:o.opacity!==undefined?o.opacity:1,side:THREE.DoubleSide});
  const put=(m,o)=>{o=o||{};m.position.set(o.x||0,o.y||0,o.z||0);if(o.rx)m.rotation.x=o.rx;if(o.ry)m.rotation.y=o.ry;if(o.rz)m.rotation.z=o.rz;scene.add(m);return m};
  const mesh=(g,o)=>put(new THREE.Mesh(g,mat(o||{})),o);
  scene.add(new THREE.AmbientLight(0xffffff,.75));
  const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(6,12,10);scene.add(sun);
  scene.background=new THREE.Color('#0A0D1F');
  const ground=new THREE.Group();
  const gp=new THREE.Mesh(new THREE.CircleGeometry(40,48),new THREE.MeshStandardMaterial({color:'#141838',roughness:1}));gp.rotation.x=-Math.PI/2;gp.position.y=-.02;ground.add(gp);
  ground.add(new THREE.GridHelper(60,60,0x2a2f5c,0x1b2048));scene.add(ground);

  S.world=o=>{o=o||{};if(o.ground!==undefined)ground.visible=!!o.ground;if(o.bg)scene.background=new THREE.Color(o.bg)};
  S.box=o=>{o=o||{};return mesh(new THREE.BoxGeometry(o.w||1,o.h||1,o.d||1),o)};
  S.sphere=o=>{o=o||{};return mesh(new THREE.SphereGeometry(o.r||.5,24,16),o)};
  S.cylinder=o=>{o=o||{};const r=o.r||.5;return mesh(new THREE.CylinderGeometry(r,o.r2!==undefined?o.r2:r,o.h||1,28),o)};
  S.cone=o=>{o=o||{};return mesh(new THREE.ConeGeometry(o.r||.5,o.h||1,28),o)};
  S.plane=o=>{o=o||{};return mesh(new THREE.PlaneGeometry(o.w||1,o.h||1),o)};
  S.circle=o=>{o=o||{};return mesh(new THREE.CircleGeometry(o.r||.5,32),o)};
  S.roof=o=>{o=o||{};const w=o.w||2,h=o.h||1,d=o.d||2;const sh=new THREE.Shape();sh.moveTo(-w/2,0);sh.lineTo(w/2,0);sh.lineTo(0,h);sh.lineTo(-w/2,0);const g=new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false});g.translate(0,0,-d/2);return mesh(g,o)};
  S.group=o=>put(new THREE.Group(),o);
  S.rod=(a,b,o)=>{o=o||{};const A=new THREE.Vector3(a.x||0,a.y||0,a.z||0),B=new THREE.Vector3(b.x||0,b.y||0,b.z||0);const L=A.distanceTo(B)||.001;const t=o.t||.06;const m=new THREE.Mesh(new THREE.CylinderGeometry(t,t,L,8),mat(o));m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());scene.add(m);return m};
  S.arrow=(a,b,o)=>{o=o||{};const A=new THREE.Vector3(a.x||0,a.y||0,a.z||0),B=new THREE.Vector3(b.x||0,b.y||0,b.z||0);const dir=B.clone().sub(A);const L=dir.length()||.001;dir.normalize();const hl=Math.min(.5,L*.4);const g=new THREE.Group();const sh=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,L-hl,8),mat(o));sh.position.copy(A).add(dir.clone().multiplyScalar((L-hl)/2));sh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);const hd=new THREE.Mesh(new THREE.ConeGeometry(.2,hl,12),mat(o));hd.position.copy(B).sub(dir.clone().multiplyScalar(hl/2));hd.quaternion.copy(sh.quaternion);g.add(sh);g.add(hd);scene.add(g);return g};
  S.text=(str,o)=>{o=o||{};str=String(str);const c=document.createElement('canvas'),x=c.getContext('2d');const fs=96,f='bold '+fs+'px system-ui,sans-serif';x.font=f;const w=Math.ceil(x.measureText(str).width)+40;c.width=w;c.height=fs+40;x.font=f;x.textAlign='center';x.textBaseline='middle';if(o.bg){x.fillStyle=o.bg;x.beginPath();if(x.roundRect)x.roundRect(0,0,w,c.height,30);else x.rect(0,0,w,c.height);x.fill()}x.fillStyle=o.color||'#ffffff';x.fillText(str,w/2,c.height/2+4);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));const h=o.size||.8;sp.scale.set(h*c.width/c.height,h,1);sp.renderOrder=10;return put(sp,o)};

  const tween=(fn,t)=>{
    if(S.aborted)return Promise.reject(new Error('abort'));
    if(dry||!t||t<=0){fn(1);return Promise.resolve()}
    return new Promise((res,rej)=>S.tweens.push({fn:fn,t:t,e:0,res:res,rej:rej}));
  };
  S.tick=dt=>{
    const keep=[];
    S.tweens.forEach(w=>{w.e+=dt;const k=Math.min(1,w.e/w.t);w.fn(k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2);if(k>=1)w.res();else keep.push(w)});
    S.tweens=keep;
    S.levels.forEach(c=>{if(c.parent&&c.parent!==scene)c.rotation.z=-c.parent.rotation.z});
  };
  const axes=['x','y','z'];
  S.move=(o,p,t)=>{const a=o.position.clone();return tween(k=>{axes.forEach(q=>{if(p[q]!==undefined)o.position[q]=a[q]+(p[q]-a[q])*k})},t)};
  S.rotate=(o,p,t)=>{const a={x:o.rotation.x,y:o.rotation.y,z:o.rotation.z};return tween(k=>{axes.forEach(q=>{if(p[q]!==undefined)o.rotation[q]=a[q]+(p[q]-a[q])*k})},t)};
  S.scaleTo=(o,p,t)=>{if(typeof p==='number')p={x:p,y:p,z:p};const a=o.scale.clone();return tween(k=>{axes.forEach(q=>{if(p[q]!==undefined)o.scale[q]=a[q]+(p[q]-a[q])*k})},t)};
  const mats=o=>{const l=[];o.traverse(n=>{if(n.material)(Array.isArray(n.material)?n.material:[n.material]).forEach(m=>l.push(m))});return l};
  S.fade=(o,v,t)=>{const l=mats(o).map(m=>{m.transparent=true;return [m,m.opacity]});return tween(k=>{l.forEach(p=>{p[0].opacity=p[1]+(v-p[1])*k})},t)};
  S.recolor=(o,c,t)=>{const to=new THREE.Color(c);const l=mats(o).filter(m=>m.color).map(m=>[m,m.color.clone()]);return tween(k=>{l.forEach(p=>{p[0].color.copy(p[1]).lerp(to,k)})},t)};
  S.wait=t=>tween(()=>{},t);
  S.all=l=>Promise.all(l);
  S.keepLevel=c=>{S.levels.push(c)};
  S.focus=(p,zoom,t,o)=>{p=p||{};o=o||{};const a=Object.assign({},cam);const b={tx:p.x!==undefined?p.x:cam.tx,ty:p.y!==undefined?p.y:cam.ty,tz:p.z!==undefined?p.z:cam.tz,zoom:zoom||cam.zoom,az:o.az!==undefined?o.az:cam.az,el:o.el!==undefined?o.el:cam.el};return tween(k=>{for(const q in b)cam[q]=a[q]+(b[q]-a[q])*k},t)};
  S.say=text=>{if(S.aborted)return Promise.reject(new Error('abort'));if(dry)return Promise.resolve();hooks.caption(String(text));return hooks.say(String(text),S)};
  return S;
}
const EXAMPLE=`const pivotY=5;
S.cylinder({r:1.3,h:.3,color:"#5c677d",y:.15});
S.cylinder({r:.22,h:pivotY,color:"#8d99ae",y:pivotY/2});
const beam=S.group({y:pivotY});
beam.add(S.box({w:7,h:.25,d:.5,color:"#edf2f4"}));
beam.add(S.sphere({r:.33,color:"#ffb84d"}));
const L=S.group({x:-3.2}), R=S.group({x:3.2});
beam.add(L); beam.add(R); S.keepLevel(L); S.keepLevel(R);
for(const g of [L,R]){
  g.add(S.rod({x:0,y:0},{x:0,y:-1.6},{color:"#adb5bd",t:.04}));
  g.add(S.cylinder({r:1.1,h:.15,color:"#ffb84d",y:-1.65}));
}
function weight(n,pan,color){
  const w=S.group({y:-1.2});
  w.add(S.box({w:.9,h:.7,d:.9,color:color}));
  w.add(S.text(String(n),{size:.55,color:"#0a0d1f",z:.5}));
  pan.add(w); return w;
}
await S.say("Voici une balance. Elle penche du côté le plus lourd.");
const w10=weight(10,L,"#4cc9f0"); S.fade(w10,0,0); await S.fade(w10,1,.8);
await S.rotate(beam,{z:.3},1.5);
await S.say("À gauche, je pose un poids de dix. Ce côté descend.");
const w5=weight(5,R,"#f72585"); S.fade(w5,0,0); await S.fade(w5,1,.8);
await S.rotate(beam,{z:.15},1.2);
await S.say("À droite, je pose un poids de cinq. Dix contre cinq : la balance penche encore. Donc dix n'est pas égal à cinq.");
const w5b=weight(5,R,"#f72585"); w5b.position.y=-.5; S.fade(w5b,0,0);
await S.fade(w5b,1,.6);
await S.rotate(beam,{z:0},1.5);
await S.say("Mais si je pose un deuxième cinq à droite, la balance est à plat. Dix est égal à cinq plus cinq.");`;
/*END*/

const CODE_SYS=`You write the BODY of an async JavaScript function (parameters: S, THREE) that animates a user's idea as a short explanatory film in a 3D scene. Use await for every animation. No imports, no DOM, no fetch, no setTimeout, no infinite loops.

VIEW: a PORTRAIT phone screen. Visible area is about x from -5 to 5 and y from -5 to 15 (ground at y=0, camera looks at (0,5,0)). Keep everything inside x -4.5..4.5 and y 0..13. 1 unit is about 1 meter. z is depth (0 = front).

CREATE (every creator accepts {x,y,z,color,opacity,rx,ry,rz} and returns a THREE.Object3D, already in the scene):
S.box({w,h,d}) S.sphere({r}) S.cylinder({r,h,r2}) (r2 = bottom radius, optional) S.cone({r,h}) S.roof({w,h,d}) (triangular prism, base on y=0, centred) S.plane({w,h}) S.circle({r}) S.group({x,y,z}) (empty container for hierarchies) S.text('5',{size:0.8,color:'#fff',bg:'#00000099'}) (label that always faces the camera) S.rod(a,b,{color,t}) (thin bar from point a to point b, points are {x,y,z}) S.arrow(a,b,{color}).
Shapes are centred on their position. Parent/child: parent.add(child) keeps the child's LOCAL position; parent.attach(child) keeps its WORLD position. Children move and rotate with their parent. Colors are hex strings.

ANIMATE (all return promises, t in seconds, use t=0 for instant):
S.move(obj,{x,y,z},t) S.rotate(obj,{x,y,z},t) (absolute radians; rotation.z > 0 turns counterclockwise as the viewer sees it, so the LEFT end of a horizontal bar goes DOWN) S.scaleTo(obj,n or {x,y,z},t) S.fade(obj,opacity,t) S.recolor(obj,'#hex',t) S.wait(t) S.all([p1,p2]) (run together) S.focus({x,y,z},zoom,t,{az,el}) (move the camera, zoom 1 = default, az/el in radians for a 3D angle) S.keepLevel(child) (call after parent.add(child): the child stays upright when the parent rotates) S.world({ground:true or false,bg:'#hex'}).
S.say('sentence in French') shows a caption and a voice reads it; it waits until the voice finishes.

RULES:
1. Draw exactly what the user says, with the right numbers and proportions. Show numbers as S.text labels. Never invent a different idea.
2. Build the scene step by step and explain every step with S.say in simple French (one or two short sentences, everyday words, no symbols such as * / = + : write 'égal à', 'plus'). 8 to 14 S.say calls in total, about 40 to 90 seconds.
3. If the idea is a claim (equal or not equal, true or false, possible or impossible), TEST it: show the case that confirms it AND the case that contradicts it, say clearly what the result is and why. Finish with a short conclusion.
4. Show real behaviour with movement (weights landing, things rotating, doors opening, liquid rising, objects falling). Make objects appear with S.fade from 0 (call S.fade(obj,0,0) first) or S.move them in. Use S.focus to zoom on important parts and, for 3D things, turn the camera a little (az 0.4).
5. Bright readable colors on the dark ground. Label important objects. Make objects big enough to see (at least 0.5 units).
6. Output ONLY the JavaScript code in one js code block, no explanation.

EXAMPLE for the idea 'a balance: 10 on one side, 5 on the other, is that equal?':
` + '```js\n' + EXAMPLE + '\n```';

const UNDERSTAND_SYS='Tu es un réalisateur qui explique des idées par des animations. Réponds UNIQUEMENT avec un JSON valide: {"comprehension":"2 à 3 phrases en français, à la deuxième personne, qui disent ce que tu as compris","visualisable":true ou false,"raison":"si false: explique simplement en français ce qu il faut préciser","plan":"en français: la liste courte des étapes de l animation, y compris ce que tu vas tester ou démontrer"}. Reste fidèle à ce que la personne a dit.';

const $=id=>document.getElementById(id);
const LS={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let run=0,und='',lastCode='',CUR=null,cancelSay=null,MODELS=null,renderer=null,camera=null,renderScene=null,lastT=0;
const CAM={tx:0,ty:5,tz:0,zoom:1,az:0,el:.1},FOV=50;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function msg(t){$('msg').textContent=t||''}
function setW(t,s,p){$('wt').textContent=t;$('ws').textContent=s||'';$('wb').style.width=p+'%'}

['Une balance : 10 d\'un côté, 5 de l\'autre. Est-ce égal ?','Une maison avec un toit, deux fenêtres et une porte qui s\'ouvre','Un ballon qui tombe et rebondit trois fois'].forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{$('idea').value=t;cnt();$('idea').focus()};$('chips').appendChild(b)});
function cnt(){const n=$('idea').value.length;$('cnt').textContent=n+(n>1?' caractères':' caractère')}
$('idea').addEventListener('input',cnt);

function openSheet(){$('kq').value=LS.get('k_groq');$('sheet').classList.add('on')}
$('gear').onclick=openSheet;
$('save').onclick=()=>{LS.set('k_groq',$('kq').value.trim());MODELS=null;$('sheet').classList.remove('on');msg('')};
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('sheet').classList.remove('on')});
if(!LS.get('k_groq'))setTimeout(openSheet,500);

async function groqModels(key){
  const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+key}});
  if(r.status===401)throw new Error('Ta clé Groq n\'est pas acceptée. Vérifie-la dans les réglages ⚙.');
  if(!r.ok)throw new Error('Groq ne répond pas (erreur '+r.status+'). Réessaie dans un instant.');
  const ids=((await r.json()).data||[]).map(m=>m.id);
  const pref=['llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','meta-llama/llama-4-scout-17b-16e-instruct','llama-3.1-8b-instant'];
  const bad=/whisper|guard|tts|orpheus|playai|allam|safeguard/i;
  const first=pref.filter(x=>ids.includes(x));
  return first.concat(ids.filter(x=>!first.includes(x)&&!bad.test(x))).slice(0,4);
}
async function chat(messages,o){
  const key=LS.get('k_groq');
  if(!key)throw new Error('Ajoute ta clé Groq dans les réglages ⚙ pour commencer.');
  if(!MODELS)MODELS=await groqModels(key);
  if(!MODELS.length)throw new Error('Aucun modèle Groq disponible avec cette clé.');
  let last='';
  for(const m of MODELS){
    for(const json of (o.json?[true,false]:[false])){
      try{
        const body={model:m,temperature:o.temp||.4,max_tokens:o.max||1500,messages:messages};
        if(json)body.response_format={type:'json_object'};
        const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(body)});
        if(!r.ok){last=r.status;continue}
        const j=await r.json();return j.choices[0].message.content||'';
      }catch(e){last=e.message}
    }
  }
  throw new Error(last==429?'Groq reçoit trop de demandes. Attends une minute puis réessaie.':'Groq n\'a pas pu répondre (erreur '+last+'). Réessaie dans un instant.');
}
function extractCode(t){const m=t.match(/```(?:js|javascript)?\s*([\s\S]*?)```/);return (m?m[1]:t).trim()}

/* voix */
function stopSpeech(){try{if(window.Android)Android.stop();else if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
function sayNow(text){
  return new Promise(res=>{
    let done=false,to=null;
    const fin=()=>{if(done)return;done=true;clearTimeout(to);window.ttsDone=null;cancelSay=null;setTimeout(res,350)};
    to=setTimeout(fin,text.length*110+5000);window.ttsDone=fin;cancelSay=fin;
    try{if(window.Android)Android.speak(text);else if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.onend=fin;speechSynthesis.speak(u)}else fin()}catch(e){fin()}
  });
}

/* moteur 3D */
function initGL(){
  if(renderer)return true;if(!window.THREE)return false;
  renderer=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
  camera=new THREE.PerspectiveCamera(FOV,1,.1,300);
  window.addEventListener('resize',resize);resize();
  requestAnimationFrame(loop);return true;
}
function resize(){if(!renderer)return;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  if(!$('play').classList.contains('on')||!renderScene)return;
  if(CUR)CUR.tick(dt);
  const tn=Math.tan(FOV/2*Math.PI/180),D=Math.max(5/(tn*camera.aspect),10/tn)/CAM.zoom;
  camera.position.set(CAM.tx+D*Math.sin(CAM.az)*Math.cos(CAM.el),CAM.ty+D*Math.sin(CAM.el),CAM.tz+D*Math.cos(CAM.az)*Math.cos(CAM.el));
  camera.lookAt(CAM.tx,CAM.ty,CAM.tz);
  renderer.render(renderScene,camera);
}
const AsyncFunction=Object.getPrototypeOf(async function(){}).constructor;
async function execute(code,live){
  const scene=new THREE.Scene();
  const cam=live?CAM:{tx:0,ty:5,tz:0,zoom:1,az:0,el:.1};
  if(live)Object.assign(CAM,{tx:0,ty:5,tz:0,zoom:1,az:0,el:.1});
  const S=makeS(scene,!live,cam,{caption:t=>{$('cap').textContent=t},say:(t)=>sayNow(t)});
  if(live){CUR=S;renderScene=scene}
  await new AsyncFunction('S','THREE',code)(S,THREE);
}
function dry(code){
  return Promise.race([execute(code,false),new Promise((_,rej)=>setTimeout(()=>rej(new Error('The code takes too long or loops forever.')),6000))]);
}
function stopLive(){
  if(CUR){CUR.aborted=true;CUR.tweens.forEach(w=>w.rej(new Error('abort')));CUR.tweens=[];CUR=null}
  if(cancelSay)cancelSay();stopSpeech();
}

/* pipeline */
async function start(){
  const idea=$('idea').value.trim();
  if(idea.length<10){msg('Écris un peu plus, pour que je comprenne bien ton idée.');return}
  if(!window.THREE){msg('Il faut internet pour afficher le film. Connecte-toi puis réessaie.');return}
  msg('');const my=++run;show('work');$('und').textContent='';setW('Je lis ton idée…','Un instant, je comprends ce que tu veux montrer.',8);
  try{
    const t=await chat([{role:'system',content:UNDERSTAND_SYS},{role:'user',content:idea}],{json:true,max:900,temp:.4});
    if(my!==run)return;
    const d=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
    und=d.comprehension||'';$('und').textContent=und;
    if(!d.visualisable){show('home');msg(d.raison||'Je ne vois pas encore ton idée. Ajoute des détails : quoi, combien, que se passe-t-il.');return}
    setW('J\'écris l\'animation…','Je prépare les dessins et les mouvements.',30);
    const msgs=[{role:'system',content:CODE_SYS},{role:'user',content:'User idea (French): '+idea+'\nWhat you understood: '+und+'\nPlan: '+(d.plan||'')}];
    let code=extractCode(await chat(msgs,{max:4000,temp:.3}));
    if(my!==run)return;
    for(let a=0;;a++){
      setW('Je vérifie que tout marche…','',55+a*15);
      try{await dry(code);break}
      catch(e){
        if(my!==run)return;
        if(a>=2)throw new Error('Je n\'ai pas réussi à dessiner cette idée. Essaie de la dire autrement, avec des phrases plus simples.');
        setW('Je corrige un détail…','',70);
        msgs.push({role:'assistant',content:'```js\n'+code+'\n```'});
        msgs.push({role:'user',content:'This code failed with: '+(e.message||e)+'. Fix it and return the complete corrected code only, in one js code block.'});
        code=extractCode(await chat(msgs,{max:4000,temp:.2}));
        if(my!==run)return;
      }
    }
    lastCode=code;setW('Ton film est prêt','',100);
    setTimeout(()=>{if(my===run)play()},800);
  }catch(e){if(my===run){show('home');msg(e.message||'Une erreur est arrivée. Vérifie ta connexion et réessaie.')}}
}
$('go').onclick=start;

/* lecteur */
function setBar(mode){
  const b=$('pbar');b.innerHTML='';
  const mk=(c,t,f)=>{const x=document.createElement('button');x.className=c;x.textContent=t;x.onclick=f;b.appendChild(x)};
  if(mode==='end'){mk('cta','Revoir le film',play);mk('ghost','Nouvelle idée',closePlay)}
  else mk('ghost','Arrêter',closePlay);
}
async function play(){
  if(!initGL()){msg('Il faut internet pour afficher le film.');show('home');return}
  stopLive();show('play');resize();$('cap').textContent='';setBar('stop');
  try{await execute(lastCode,true);setBar('end')}
  catch(e){if(e.message!=='abort'){$('cap').textContent='Un problème est arrivé pendant le film.';setBar('end')}}
}
function closePlay(){stopLive();renderScene=null;show('home')}
$('close').onclick=closePlay;

window.onBack=()=>{
  if($('sheet').classList.contains('on')){$('sheet').classList.remove('on');return true}
  if($('play').classList.contains('on')){closePlay();return true}
  if($('work').classList.contains('on')){run++;show('home');return true}
  return false;
};
